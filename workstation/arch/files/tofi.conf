# Horizontal dmenu strip, touching the 30px Waybar below it on every output.
anchor = bottom
width = 100%
height = 30
horizontal = true
exclusive-zone = -1
margin-bottom = 30
font = DejaVu Sans Mono
font-size = 12
prompt-text = "run > "
outline-width = 0
border-width = 0
background-color = #1e1e1e
text-color = #d4d4d4
selection-color = #ffffff
selection-background = #094771
selection-match-color = #9cdcfe
min-input-width = 160
result-spacing = 20
padding-top = 5
padding-bottom = 0
padding-left = 12
padding-right = 12
drun-launch = true
