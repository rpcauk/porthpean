# Same Dark+ palette, with the supplied wallpaper blurred by the GPU at lock time.
general {
    hide_cursor = true
}
animations {
    enabled = false
}
background {
    monitor =
    path = /usr/share/backgrounds/porthpean/diogenes.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.45
}
input-field {
    monitor =
    size = 360, 48
    outline_thickness = 0
    inner_color = rgb(252526)
    font_color = rgb(d4d4d4)
    check_color = rgb(4ec9b0)
    fail_color = rgb(f44747)
    font_family = DejaVu Sans Mono
    placeholder_text =
    fail_text = Authentication failed
    fade_on_empty = false
    rounding = 0
    position = 0, -30
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgb(d4d4d4)
    font_size = 48
    font_family = DejaVu Sans Mono
    position = 0, 165
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(d4d4d4)
    font_size = 12
    font_family = DejaVu Sans Mono
    position = 0, 110
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:2000] /usr/local/bin/porthpean-media
    color = rgb(d4d4d4)
    font_size = 12
    font_family = DejaVu Sans Mono
    position = 0, 35
    halign = center
    valign = bottom
}
