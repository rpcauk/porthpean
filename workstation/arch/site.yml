---
- name: Configure Arch workstation after manual base install
  hosts: all
  become: false
  vars:
    agent_users: []
    xkb_layout: us
    packages:
      - niri
      - waybar
      - fuzzel
      - foot
      - mako
      - pipewire
      - pipewire-audio
      - pipewire-alsa
      - pipewire-pulse
      - wireplumber
      - greetd
      - greetd-tuigreet
      - greetd-regreet
      - cage
      - plymouth
      - swaybg
      - hyprlock
      - playerctl
      - thunderbird
      - xdg-utils
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xwayland-satellite
      - swaylock
      - swayidle
      - wl-clipboard
      - brightnessctl
      - polkit
      - gnome-keyring
      - firefox
      - mpv
      - zathura
      - zathura-pdf-mupdf
      - thunar
      - keepassxc
      - noto-fonts
      - noto-fonts-emoji
      - ttf-dejavu
      - git
      - tmux
      - sudo
      - zsh
      - fzf
      - curl
      - jq
      - ripgrep
      - neovim
      - less
      - libnewt
      - restic
      - openssh
      - nodejs
      - npm
      - nftables
      - zram-generator
      - pacman-contrib
      - btrfs-progs
  tasks:
    - name: Validate platform and requested identity
      tags: [always]
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Archlinux'
          - daily_user is match('^[a-z][a-z0-9_-]*$')
          - daily_user not in ['root', 'codex', 'amp']
          - agent_users is sequence
          - agent_users is not string
          - agent_users | difference(['codex', 'amp']) | length == 0
          - xkb_layout is match('^[a-z]{2}$')
    - name: Read local daily user record
      tags: [always]
      ansible.builtin.getent:
        database: passwd
        key: '{{ daily_user }}'
    - name: Install official packages (bootstrap already performed complete upgrade)
      tags: [packages]
      ansible.builtin.command:
        argv: "{{ ['pacman', '-S', '--needed', '--noconfirm'] + packages }}"
      register: package_install
      changed_when: "'there is nothing to do' not in (package_install.stdout + package_install.stderr)"
      when: not ansible_check_mode and not (packages_preinstalled | default(false) | bool)
    - name: Create isolated agent accounts with locked passwords and no privileged groups
      tags: [accounts]
      ansible.builtin.user:
        name: '{{ item }}'
        shell: /bin/zsh
        create_home: true
        groups: ''
        append: false
        password_lock: true
      loop: '{{ agent_users }}'
    - name: Ensure sudo loads managed command rules
      tags: [accounts]
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: '^\s*[@#]includedir\s+"?/etc/sudoers[.]d"?\s*$'
        line: '@includedir /etc/sudoers.d'
        owner: root
        group: root
        mode: '0440'
        backup: true
        validate: /usr/sbin/visudo -cf %s
    - name: Allow daily package management and power controls with password authentication
      tags: [accounts]
      ansible.builtin.template:
        src: files/daily-sudoers.j2
        dest: /etc/sudoers.d/20-porthpean-daily
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
    - name: Remove interrupted installer sudo grant on boot
      tags: [accounts]
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/porthpean-installer.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          r /etc/sudoers.d/zz-porthpean-install - - - -
    - name: Validate complete sudo configuration
      tags: [accounts]
      ansible.builtin.command: /usr/sbin/visudo -c
      changed_when: false
      when: not ansible_check_mode
    - name: Verify effective daily package-management permission
      tags: [accounts]
      ansible.builtin.command:
        argv: [sudo, '-l', '-U', '{{ daily_user }}', /usr/bin/pacman, '-Syu']
      changed_when: false
      when: not ansible_check_mode
    - name: Protect personal and agent homes
      tags: [accounts]
      ansible.builtin.file:
        path: '/home/{{ item }}'
        state: directory
        mode: '0700'
        owner: '{{ item }}'
        group: '{{ item }}'
      loop: '{{ [daily_user] + agent_users }}'
    - name: Create private per-agent workspaces
      tags: [accounts]
      ansible.builtin.file:
        path: '/home/{{ item }}/Projects'
        state: directory
        owner: '{{ item }}'
        group: '{{ item }}'
        mode: '0700'
      loop: '{{ agent_users }}'
    - name: Install agent operating instructions
      tags: [accounts]
      ansible.builtin.copy:
        src: files/agent-AGENTS.md
        dest: '/home/{{ item }}/Projects/AGENTS.md'
        owner: '{{ item }}'
        group: '{{ item }}'
        mode: '0600'
      loop: '{{ agent_users }}'
    - name: Configure Zsh as the managed accounts' default shell
      tags: [shell]
      ansible.builtin.user:
        name: '{{ item }}'
        shell: /bin/zsh
      loop: '{{ [daily_user] + agent_users }}'
    - name: Install shared-history helper
      tags: [shell]
      ansible.builtin.copy:
        src: files/porthpean-shell-history
        dest: /usr/local/bin/porthpean-shell-history
        owner: root
        group: root
        mode: '0755'
    - name: Configure each account's private shell files
      tags: [shell]
      ansible.builtin.include_tasks:
        file: shell.yml
        apply:
          tags: [shell]
      loop: '{{ [daily_user] + agent_users }}'
      loop_control:
        loop_var: shell_user
    - name: Create user configuration directories
      tags: [desktop]
      ansible.builtin.file:
        path: '/home/{{ daily_user }}/.config/{{ item }}'
        state: directory
        owner: '{{ daily_user }}'
        group: '{{ daily_user }}'
        mode: '0700'
      loop: ['', niri, waybar, mako, foot, fuzzel, hypr, gtk-3.0, gtk-4.0]
    - name: Install managed desktop files (backs up existing files)
      tags: [desktop]
      ansible.builtin.copy:
        src: 'files/{{ item.src }}'
        dest: '/home/{{ daily_user }}/.config/{{ item.dest }}'
        owner: '{{ daily_user }}'
        group: '{{ daily_user }}'
        mode: '0600'
        backup: true
      loop:
        - {src: waybar.jsonc, dest: waybar/config.jsonc}
        - {src: mako.conf, dest: mako/config}
        - {src: foot.ini, dest: foot/foot.ini}
        - {src: waybar.css, dest: waybar/style.css}
        - {src: fuzzel.ini, dest: fuzzel/fuzzel.ini}
        - {src: hyprlock.conf, dest: hypr/hyprlock.conf}
        - {src: gtk-settings.ini, dest: gtk-3.0/settings.ini}
        - {src: gtk-settings.ini, dest: gtk-4.0/settings.ini}
        - {src: dark-plus.css, dest: gtk-3.0/gtk.css}
        - {src: dark-plus.css, dest: gtk-4.0/gtk.css}
    - name: Create shared wallpaper directory accessible to the session
      tags: [desktop]
      ansible.builtin.file:
        path: /usr/share/backgrounds/porthpean
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Install supplied Diogenes wallpaper without modifying it
      tags: [desktop]
      ansible.builtin.copy:
        src: files/wallpapers/diogenes.jpg
        dest: /usr/share/backgrounds/porthpean/diogenes.jpg
        owner: root
        group: root
        mode: '0644'
    - name: Install session helper programs
      tags: [desktop]
      ansible.builtin.copy:
        src: 'files/{{ item }}'
        dest: '/usr/local/bin/{{ item }}'
        owner: root
        group: root
        mode: '0755'
      loop: [porthpean-lock, porthpean-media, porthpean-agent, porthpean-agent-session, porthpean-citrix]
    - name: Create user desktop-entry directories
      tags: [desktop]
      ansible.builtin.file:
        path: '/home/{{ daily_user }}/{{ item }}'
        state: directory
        owner: '{{ daily_user }}'
        group: '{{ daily_user }}'
        mode: '0700'
      loop: [.local, .local/share, .local/share/applications]
    - name: Route Citrix launcher to the workplace web portal
      tags: [desktop]
      ansible.builtin.copy:
        dest: '/home/{{ daily_user }}/.local/share/applications/citrix-workspace.desktop'
        owner: '{{ daily_user }}'
        group: '{{ daily_user }}'
        mode: '0600'
        backup: true
        content: |
          [Desktop Entry]
          Type=Application
          Name=Citrix Workspace
          Exec=porthpean-citrix
          Terminal=false
          Categories=Network;
    - name: Register native Citrix ICA file launcher
      tags: [desktop]
      ansible.builtin.copy:
        dest: /usr/share/applications/porthpean-citrix-ica.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=Citrix ICA session
          Exec=env GDK_BACKEND=x11 /opt/Citrix/ICAClient/wfica.sh %f
          Terminal=false
          NoDisplay=true
          MimeType=application/x-ica;
    - name: Associate downloaded ICA sessions with the native client
      tags: [desktop]
      ansible.builtin.command:
        argv: [runuser, '-u', '{{ daily_user }}', '--', env, 'HOME=/home/{{ daily_user }}', 'XDG_CONFIG_HOME=/home/{{ daily_user }}/.config', xdg-mime, default, porthpean-citrix-ica.desktop, application/x-ica]
      changed_when: false
      when: not ansible_check_mode
    - name: Install the unprivileged agent installer
      tags: [desktop]
      ansible.builtin.copy:
        src: '{{ item.src }}'
        dest: '/usr/local/bin/{{ item.dest }}'
        owner: root
        group: root
        mode: '{{ item.mode }}'
      loop:
        - {src: install-agent, dest: porthpean-install-agent, mode: '0755'}
    - name: Create local web and agent launchers
      tags: [desktop]
      ansible.builtin.copy:
        dest: '/usr/share/applications/porthpean-{{ item.id }}.desktop'
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name={{ item.name }}
          Exec={{ item.exec }}
          Terminal=false
          Categories=Utility;
      loop:
        - {id: citrix, name: Citrix Workspace portal, exec: 'porthpean-citrix'}
        - {id: chatgpt, name: ChatGPT, exec: 'firefox https://chatgpt.com/'}
        - {id: codex, name: Codex agent, exec: 'porthpean-agent codex'}
        - {id: amp, name: Amp agent, exec: 'porthpean-agent amp'}
        - {id: codex-web, name: Codex web, exec: 'firefox https://chatgpt.com/codex'}
        - {id: amp-web, name: Amp web, exec: 'firefox https://ampcode.com/'}
    - name: Install graphical login palette and settings
      tags: [services]
      ansible.builtin.copy:
        src: 'files/{{ item.src }}'
        dest: '/etc/greetd/{{ item.dest }}'
        owner: root
        group: root
        mode: '0644'
        backup: true
      loop:
        - {src: dark-plus.css, dest: dark-plus.css}
        - {src: regreet.toml, dest: regreet.toml}
    - name: Keep kernel logs in journal instead of over the login prompt
      tags: [services]
      ansible.builtin.copy:
        dest: /etc/sysctl.d/20-quiet-console.conf
        mode: '0644'
        content: |
          kernel.printk = 3 4 1 3
    - name: Render Niri configuration from the selected keyboard profile
      tags: [desktop]
      ansible.builtin.template:
        src: files/config.kdl.j2
        dest: '/home/{{ daily_user }}/.config/niri/config.kdl'
        owner: '{{ daily_user }}'
        group: '{{ daily_user }}'
        mode: '0600'
        backup: true
    - name: Validate installed Niri configuration without starting desktop
      tags: [validate]
      ansible.builtin.command:
        argv: [niri, validate, -c, '/home/{{ daily_user }}/.config/niri/config.kdl']
      changed_when: false
      when: not ansible_check_mode
    - name: Install greetd configuration without autologin
      tags: [services]
      ansible.builtin.copy:
        dest: /etc/greetd/config.toml
        mode: '0644'
        backup: true
        content: |
          [terminal]
          vt = 1
          [default_session]
          command = "env XKB_DEFAULT_LAYOUT={{ xkb_layout }} GTK_USE_PORTAL=0 GDK_DEBUG=no-portals dbus-run-session cage -s -- regreet --style /etc/greetd/dark-plus.css"
          user = "greeter"
    - name: Configure compressed RAM swap, no hibernation
      tags: [services]
      ansible.builtin.copy:
        dest: /etc/systemd/zram-generator.conf
        mode: '0644'
        content: |
          [zram0]
          zram-size = min(ram / 2, 4096)
          compression-algorithm = zstd
    - name: Install standalone workstation firewall policy
      tags: [services]
      ansible.builtin.copy:
        src: files/nftables.conf
        dest: /etc/nftables.conf
        mode: '0600'
        backup: true
    - name: Validate firewall before activation on next reboot
      tags: [validate]
      ansible.builtin.command: nft --check --file /etc/nftables.conf
      changed_when: false
      when: not ansible_check_mode
    - name: Enable local desktop and firewall for next boot, no session restart
      tags: [activate]
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        enabled: true
      loop: [greetd.service, nftables.service]
    - name: State remaining interactive gates
      tags: [finalize]
      ansible.builtin.debug:
        msg: 'Reboot deliberately after reviewing results. Agent installers/authentication, Kanata remapping, backup destination and Secure Boot enrollment are separate documented steps. No SSH listener or unattended agent enabled.'
    - name: Record non-secret installation choices for checks
      tags: [finalize]
      ansible.builtin.copy:
        dest: /etc/porthpean-workstation.json
        mode: '0600'
        content: '{{ {"daily_user": daily_user, "agent_users": agent_users, "xkb_layout": xkb_layout} | to_nice_json }}'
